<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210"><rect width="100%" height="100%" fill="white"/><text x="25" y="38" font-family="DejaVu Sans" font-size="27" fill="#253f52" font-weight="bold" text-anchor="start">PENDANT L’ANIMATION</text><line x1="30" y1="77" x2="182" y2="77" stroke="#1766ad" stroke-width="10" stroke-linecap="round"/><text x="210" y="85" font-family="DejaVu Sans" font-size="29" fill="#1766ad" font-weight="normal" text-anchor="start">Bleu = traction</text><line x1="30" y1="132" x2="182" y2="132" stroke="#ba403d" stroke-width="10" stroke-linecap="round"/><text x="210" y="140" font-family="DejaVu Sans" font-size="29" fill="#ba403d" font-weight="normal" text-anchor="start">Rouge = compression</text><line x1="620" y1="14" x2="620" y2="197" stroke="#d9dfe3" stroke-width="2" stroke-linecap="round"/><text x="662" y="38" font-family="DejaVu Sans" font-size="27" fill="#253f52" font-weight="bold" text-anchor="start">APRÈS LE TEST</text><text x="662" y="82" font-family="DejaVu Sans" font-size="27" fill="#253f52" font-weight="normal" text-anchor="start">De retour au dessin :</text><text x="662" y="126" font-family="DejaVu Sans" font-size="27" fill="#253f52" font-weight="normal" text-anchor="start">une barre surlignée signale</text><text x="662" y="164" font-family="DejaVu Sans" font-size="27" fill="#253f52" font-weight="bold" text-anchor="start">une résistance insuffisante.</text></svg>